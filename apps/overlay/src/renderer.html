<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battlegrounds Overlay</title>
  <style>
    body {
      margin: 0;
      padding: 12px 16px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
      background: transparent;
      user-select: none;
    }
    #advice-action {
      font-size: 18px;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 4px;
    }
    #advice-reason {
      font-size: 13px;
      color: #b0b0b0;
      margin-bottom: 6px;
    }
    #explanation {
      font-size: 11px;
      color: #888;
      border-top: 1px solid #333;
      padding-top: 4px;
      display: none;
    }
    #explanation.visible {
      display: block;
    }
    #damage-forecast {
      font-size: 12px;
      color: #a0d0a0;
      border-top: 1px solid #333;
      padding-top: 4px;
    }
    #board-count {
      font-size: 12px;
      color: #a0c0d0;
      border-top: 1px solid #333;
      padding-top: 4px;
    }
    #board-best-attack {
      font-size: 12px;
      color: #d0d0a0;
      border-top: 1px solid #333;
      padding-top: 4px;
    }
    #opponent-count {
      font-size: 12px;
      color: #d0a0a0;
      border-top: 1px solid #333;
      padding-top: 4px;
    }
    #opponent-alive {
      font-size: 12px;
      color: #a0d0a0;
      border-top: 1px solid #333;
      padding-top: 4px;
    }
  </style>
</head>
<body>
  <div id="advice-action"></div>
  <div id="advice-reason"></div>
  <ul id="advice-list"></ul>
  <div id="explanation"></div>
  <div id="damage-forecast"></div>
  <div id="board-count"></div>
  <div id="board-best-attack"></div>
  <ul id="board-minions"></ul>
  <div id="opponent-count"></div>
  <div id="opponent-alive"></div>
  <span id="advice-confidence"></span>
  <script src="./renderer-bundle.js"></script>
</body>
</html>
